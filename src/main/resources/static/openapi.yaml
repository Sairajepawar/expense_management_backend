openapi: 3.0.3
info:
  title: Expense Tracker API
  version: 1.0.0

servers:
  - url: http://localhost:9090
    description: Local server

tags:
  - name: Auth
    description: APIs used for authentication and user management
  - name: Expense
    description: APIs used to manage expense management

paths:
  /auth/api/create:
    post:
      tags:
        - Auth
      summary: Create User
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad Request, wrong request body
        '409':
          description: Conflict, user already exists in system

components:
  schemas:
    UserRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Saul Goodman
        email:
          type: string
          format: email
          example: saul@goodman.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64

    UserResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: User created successfully